<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deutsch Studio B1/B2 - Intensive Mastery</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- BOGATA BAZA PODATAKA (IT ADMIN + GENERAL) ---
    const INITIAL_DATASET = {
      writing: [
        {
          id: 'w_it1',
          topic: 'IT & Systemverwaltung',
          scenario: 'Ankündigung einer Serverwartung (Planirano održavanje servera)',
          prompt: 'Napiši obavještenje zaposlenima da će u petak od 22:00 do subote u 04:00 sata primarni serveri biti nedostupni zbog planiranog održavanja i ažuriranja sistema.',
          placeholder: 'Sehr geehrte Kolleginnen und Kollegen...',
          answerB1: 'Hallo zusammen, am Freitag von 22 Uhr bis Samstag 4 Uhr machen wir Serverwartung. Die Server funktionieren dann nicht. Bitte speichern Sie Ihre Daten.',
          answerB2: 'Sehr geehrte Kolleginnen und Kollegen, wir möchten Sie darüber informieren, dass am Freitag ab 22:00 Uhr geplante Wartungsarbeiten an unserer Serverinfrastruktur stattfinden. In diesem Zeitraum stehen die zentralen Dienste nicht zur Verfügung. Wir bitten Sie, Ihre Arbeiten rechtzeitig zu speichern.',
          keywords: ['informieren', 'Wartungsarbeiten', 'Serverinfrastruktur', 'Zeitraum', 'zur Verfügung', 'speichern'],
          tips: ['U IT okruženju koristi nominalni stil: "geplante Wartungsarbeiten finden statt".', 'Za sistem koji ne radi B2 izraz je: "steht nicht zur Verfügung" ili "ist vorübergehend außer Betrieb".']
        },
        {
          id: 'w_it2',
          topic: 'IT-Support & Helpdesk',
          scenario: 'Rückmeldung zu einem Ticket (Netzwerkstörung / Odgovor na ticket)',
          prompt: 'Napiši odgovor korisniku koji je prijavio problem sa VPN pristupom. Obavijesti ga da je problem lociran i otklonjen.',
          placeholder: 'Hallo Herr/Frau...',
          answerB1: 'Hallo Herr Schulze, das Problem mit dem VPN ist gelöst. Unser Team hat den Fehler repariert.',
          answerB2: 'Hallo Herr Schulze, vielen Dank für Ihre Meldung. Die Netzwerkstörung im Zusammenhang mit dem VPN-Zugang konnte erfolgreich lokalisiert und durch unser IT-Team behoben werden. Der Zugriff sollte ab sofort wieder einwandfrei funktionieren.',
          keywords: ['Meldung', 'Netzwerkstörung', 'lokalisiert', 'behoben', 'Zugriff', 'einwandfrei'],
          tips: ['Za grešku/problem u IT-u koristi se glagol "beheben", a ne "reparieren".', 'Pristup sistemu je "der Zugriff".']
        },
        {
          id: 'w_it3',
          topic: 'IT & Systemverwaltung',
          scenario: 'Sicherheitswarnung / Phishing-Mail (Upozorenje o bezbjednosti)',
          prompt: 'Napiši kratko upozorenje kolegama o sumnjivim e-mailovima i zamoli ih da ne klikću na linkove niti otvaraju priloge.',
          placeholder: 'Achtung an alle Mitarbeiter...',
          answerB1: 'Achtung! Es gibt gefälschte E-Mails in der Firma. Bitte klicken Sie nicht auf die Links.',
          answerB2: 'Liebe Kolleginnen und Kollegen, aktuell sind verdächtige Phishing-E-Mails in Umlauf. Wir bitten Sie dringend, keine verdächtigen Links anzuklicken und keine Dateianhänge von unbekannten Absendern zu öffnen.',
          keywords: ['aktuell', 'verdächtige', 'in Umlauf', 'dringend', 'Dateianhänge'],
          tips: ['Prilog e-maila je "der Dateianhang" (mn. die Dateianhänge).']
        },
        {
          id: 'w1',
          topic: 'Beruf',
          scenario: 'Krankmeldung beim Arbeitgeber (Prijava bolovanja)',
          prompt: 'Napiši e-mail šefu u kojem obavještavaš da si bolestan, ne dolaziš danas na posao i da ćeš poslati AU-Bescheinigung.',
          placeholder: 'Sehr geehrte/r Frau/Herr...',
          answerB1: 'Hallo Herr Müller, ich bin heute krank und kann nicht zur Arbeit kommen.',
          answerB2: 'Sehr geehrter Herr Müller, hiermit möchte ich Sie darüber informieren, dass ich heute krankheitsbedingt nicht am Arbeitsplatz erscheinen kann. Ich werde Ihnen die Arbeitsunfähigkeitsbescheinigung baldmöglichst zukommen lassen.',
          keywords: ['krankheitsbedingt', 'Arbeitsplatz', 'Arbeitsunfähigkeitsbescheinigung', 'zukommen lassen'],
          tips: ['B2 koristi "krankheitsbedingt nicht erscheinen können" umjesto "ich bin krank".']
        }
      ],
      errors: [
        {
          id: 'e_it1',
          topic: 'IT & Systemverwaltung',
          sentence: 'Der Administrator hat das neue Firewall-Update gestern installiert werden.',
          isCorrect: false,
          correctSentence: 'Der Administrator hat das neue Firewall-Update gestern installiert.',
          explanation: 'Aktivna prošlost (Perfekt) se tvori: hat + Partizip II (installiert). "werden" ovdje stvara pogrešnu konstrukciju.',
          category: 'Aktiv vs. Passiv'
        },
        {
          id: 'e_it2',
          topic: 'IT-Support & Helpdesk',
          sentence: 'Bei technische Problemen wenden Sie sich bitte direkt an den IT-Helpdesk.',
          isCorrect: false,
          correctSentence: 'Bei technischen Problemen wenden Sie sich bitte direkt an den IT-Helpdesk.',
          explanation: 'Predlog "bei" uvek zahtijeva DATIV. Množina u dativu: "bei technischen Problemen".',
          category: 'Adjektivdeklination (Dativ)'
        },
        {
          id: 'e_it3',
          topic: 'IT & Systemverwaltung',
          sentence: 'Wegen ein schwerer Systemfehler musste der Hauptserver heruntergefahren werden.',
          isCorrect: false,
          correctSentence: 'Wegen eines schweren Systemfehlers musste der Hauptserver heruntergefahren werden.',
          explanation: 'Predlog "wegen" u B2/C1 njemačkom zahtijeva GENITIV (eines schweren Systemfehlers).',
          category: 'Genitiv'
        }
      ],
      vocabulary: [
        {
          id: 'v_it1',
          topic: 'IT & Systemverwaltung',
          basic: 'neue Software aufspielen',
          context: 'Wir müssen die neue Software auf den Servern installieren.',
          options: ['bereitstellen', 'hochmachen', 'einsetzen tun', 'abstellen'],
          correctOption: 'bereitstellen',
          redemittel: 'eine Anwendung im Netzwerk bereitstellen / ausrollen',
          example: 'Das Update wurde erfolgreich im gesamten Unternehmensnetzwerk bereitgestellt.'
        },
        {
          id: 'v_it2',
          topic: 'IT-Support & Helpdesk',
          basic: 'Zugang geben',
          context: 'Der neue Mitarbeiter braucht Zugang zum Ordner.',
          options: ['Zugriff gewähren', 'Zugang erlauben', 'Rechte öffnen', 'Passwort schicken'],
          correctOption: 'Zugriff gewähren',
          redemittel: 'jemandem Zugriff auf ein System gewähren',
          example: 'Dem neuen Systemadministrator wurden die erforderlichen Zugriffsrechte gewährt.'
        }
      ],
      grammarDrill: [
        {
          id: 'g_it1',
          topic: 'IT & Systemverwaltung',
          question: 'Die Daten werden automatisch jeden Abend auf ein externes Laufwerk _____.',
          options: ['gesichert', 'sichern', 'gesichert werden', 'sicherte'],
          correct: 'gesichert',
          explanation: 'Sadašnji pasiv (Präsens Passiv): werden + Partizip II (gesichert).'
        },
        {
          id: 'g_it2',
          topic: 'IT-Support & Helpdesk',
          question: 'Bitte starten Sie den Rechner neu, _____ das Problem weiterhin besteht.',
          options: ['falls', 'obwohl', 'trotzdem', 'damit'],
          correct: 'falls',
          explanation: 'Za uslov ("u slučaju da") koristi se uslovni veznik "falls".'
        }
      ]
    };

    function App() {
      const [tab, setTab] = useState('writing');
      const [selectedTopic, setSelectedTopic] = useState('All');
      const [writingIndex, setWritingIndex] = useState(0);
      const [errorIndex, setErrorIndex] = useState(0);
      const [vocabIndex, setVocabIndex] = useState(0);
      const [userInput, setUserInput] = useState('');
      const [showResult, setShowResult] = useState(false);
      const [selectedOpt, setSelectedOpt] = useState(null);
      const [streak, setStreak] = useState(3);
      const [xp, setXp] = useState(120);

      // Moja Baza / Sačuvani unosi
      const [notes, setNotes] = useState(() => {
        const saved = localStorage.getItem('de_meister_notes');
        return saved ? JSON.parse(saved) : [];
      });
      const [newGerman, setNewGerman] = useState('');
      const [newTrans, setNewTrans] = useState('');

      useEffect(() => {
        localStorage.setItem('de_meister_notes', JSON.stringify(notes));
      }, [notes]);

      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'de-DE';
          window.speechSynthesis.speak(u);
        }
      };

      const addNote = (e) => {
        e.preventDefault();
        if (!newGerman.trim()) return;
        setNotes([{ id: Date.now(), german: newGerman, trans: newTrans, date: new Date().toLocaleDateString() }, ...notes]);
        setNewGerman('');
        setNewTrans('');
      };

      const currentWriting = INITIAL_DATASET.writing[writingIndex % INITIAL_DATASET.writing.length];
      const currentError = INITIAL_DATASET.errors[errorIndex % INITIAL_DATASET.errors.length];
      const currentVocab = INITIAL_DATASET.vocabulary[vocabIndex % INITIAL_DATASET.vocabulary.length];

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-6">
          {/* Header */}
          <header className="flex flex-wrap items-center justify-between border-b border-slate-800 pb-4 mb-6">
            <div>
              <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-violet-400">
                Deutsch Studio B1/B2
              </h1>
              <p className="text-xs text-indigo-400 font-semibold tracking-wider">
                Writing & Vocabulary Mastery • IT & Admin Focus
              </p>
            </div>
            <div className="flex gap-3 mt-2 sm:mt-0">
              <span className="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1.5 rounded-xl text-xs font-bold">
                🔥 {streak} Tage
              </span>
              <span className="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1.5 rounded-xl text-xs font-bold">
                🏆 {xp} XP
              </span>
            </div>
          </header>

          {/* Glavne Tab Navigacije */}
          <nav className="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-900/80 p-1.5 rounded-2xl mb-6 border border-slate-800">
            <button 
              onClick={() => { setTab('writing'); setShowResult(false); setUserInput(''); }}
              className={`py-2.5 text-xs font-bold rounded-xl transition ${tab === 'writing' ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
              📝 Pisanje & Stil
            </button>
            <button 
              onClick={() => { setTab('error'); setShowResult(false); }}
              className={`py-2.5 text-xs font-bold rounded-xl transition ${tab === 'error' ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
              🔍 Detektor Grešaka
            </button>
            <button 
              onClick={() => { setTab('vocab'); setShowResult(false); setSelectedOpt(null); }}
              className={`py-2.5 text-xs font-bold rounded-xl transition ${tab === 'vocab' ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
              📚 Vokabular B1 &rarr; B2
            </button>
            <button 
              onClick={() => setTab('lab')}
              className={`py-2.5 text-xs font-bold rounded-xl transition ${tab === 'lab' ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
              📁 Moja Baza ({notes.length})
            </button>
          </nav>

          {/* Glavni Moduli */}
          <main className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl">
            {/* MODULE 1: PISANJE */}
            {tab === 'writing' && (
              <div className="space-y-5">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <span className="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-xs px-3 py-1 rounded-full font-semibold">
                    {currentWriting.topic}
                  </span>
                  <button 
                    onClick={() => { setWritingIndex(writingIndex + 1); setShowResult(false); setUserInput(''); }}
                    className="text-xs text-indigo-400 hover:underline font-semibold">
                    Sljedeći scenario &rarr;
                  </button>
                </div>

                <div>
                  <h3 className="text-base font-bold text-white mb-2">{currentWriting.scenario}</h3>
                  <p className="text-sm text-slate-300 bg-slate-950/80 p-4 rounded-xl border border-slate-800/80 leading-relaxed">
                    {currentWriting.prompt}
                  </p>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-2 uppercase">Tvoj odgovor na njemačkom:</label>
                  <textarea 
                    rows="4" 
                    value={userInput}
                    onChange={(e) => setUserInput(e.target.value)}
                    placeholder={currentWriting.placeholder}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition"
                  ></textarea>
                </div>

                {!showResult ? (
                  <button 
                    onClick={() => setShowResult(true)}
                    disabled={!userInput.trim()}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">
                    Uporedi sa B1 / B2 Standardom
                  </button>
                ) : (
                  <div className="space-y-4 pt-2">
                    <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-3">
                      <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span className="text-xs font-bold text-amber-400">Standardni B1 Odgovor:</span>
                        <button onClick={() => speakText(currentWriting.answerB1)} className="text-xs text-slate-400 hover:text-white">🔊 Izgovor</button>
                      </div>
                      <p className="text-xs text-slate-300 italic">"{currentWriting.answerB1}"</p>

                      <div className="flex justify-between items-center border-b border-slate-800 pb-2 pt-2">
                        <span className="text-xs font-bold text-indigo-400">Elevirani Poslovni B2 Odgovor:</span>
                        <button onClick={() => speakText(currentWriting.answerB2)} className="text-xs text-slate-400 hover:text-white">🔊 Izgovor</button>
                      </div>
                      <p className="text-xs text-slate-100 font-medium italic">{currentWriting.answerB2}</p>
                    </div>

                    <button 
                      onClick={() => { setWritingIndex(writingIndex + 1); setShowResult(false); setUserInput(''); }}
                      className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl text-sm transition">
                      Sljedeći Scenario
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* MODULE 2: DETEKTOR GREŠAKA */}
            {tab === 'error' && (
              <div className="space-y-5">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <span className="bg-violet-500/20 text-violet-300 border border-violet-500/30 text-xs px-3 py-1 rounded-full font-semibold">
                    {currentError.category}
                  </span>
                  <button 
                    onClick={() => { setErrorIndex(errorIndex + 1); setShowResult(false); }}
                    className="text-xs text-indigo-400 hover:underline font-semibold">
                    Sljedeći primjer &rarr;
                  </button>
                </div>

                <div>
                  <h3 className="text-xs font-bold text-slate-400 mb-2 uppercase">Pronađi i analiziraj grešku:</h3>
                  <div className="bg-slate-950 border border-red-500/30 p-4 rounded-xl text-red-300 font-mono text-sm">
                    "{currentError.sentence}"
                  </div>
                </div>

                {!showResult ? (
                  <button 
                    onClick={() => setShowResult(true)}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg">
                    Prikaži Tačnu Rečenicu i Pravilo
                  </button>
                ) : (
                  <div className="space-y-4 pt-2">
                    <div className="bg-slate-950 border border-emerald-500/30 p-4 rounded-xl space-y-3">
                      <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span className="text-xs font-bold text-emerald-400">✅ Tačna Rečenica:</span>
                        <button onClick={() => speakText(currentError.correctSentence)} className="text-xs text-slate-400 hover:text-white">🔊 Izgovor</button>
                      </div>
                      <p className="text-sm font-semibold text-emerald-300 font-mono">{currentError.correctSentence}</p>

                      <div className="pt-2 border-t border-slate-800">
                        <span className="text-xs font-bold text-indigo-400">💡 Pravilo & Objašnjenje:</span>
                        <p className="text-xs text-slate-300 mt-1 leading-relaxed">{currentError.explanation}</p>
                      </div>
                    </div>

                    <button 
                      onClick={() => { setErrorIndex(errorIndex + 1); setShowResult(false); }}
                      className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl text-sm transition">
                      Sljedeći Primjer
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* MODULE 3: VOKABULAR B1 -> B2 */}
            {tab === 'vocab' && (
              <div className="space-y-5">
                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                  <span className="text-[10px] font-bold text-amber-400 uppercase tracking-wider block">B1 Osnovni Izraz:</span>
                  <span className="text-lg font-bold text-white block">{currentVocab.basic}</span>
                  <p className="text-xs text-slate-400 italic">Kontekst: "{currentVocab.context}"</p>
                </div>

                <p className="text-xs font-bold text-slate-300 uppercase">Izaberi naprednu B2 zamjenu:</p>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {currentVocab.options.map((opt, i) => {
                    const isCorrect = opt === currentVocab.correctOption;
                    const isSelected = selectedOpt === opt;
                    let style = 'bg-slate-950 border-slate-800 text-slate-200 hover:border-slate-700';

                    if (selectedOpt) {
                      if (isCorrect) style = 'bg-emerald-950/50 border-emerald-500 text-emerald-300 font-bold';
                      else if (isSelected) style = 'bg-rose-950/50 border-rose-500 text-rose-300 font-bold';
                    }

                    return (
                      <button 
                        key={i}
                        onClick={() => setSelectedOpt(opt)}
                        disabled={!!selectedOpt}
                        className={`p-3.5 rounded-xl border text-sm text-left transition ${style}`}>
                        {opt}
                      </button>
                    );
                  })}
                </div>

                {selectedOpt && (
                  <div className="space-y-4 pt-3">
                    <div className="bg-slate-950 p-4 rounded-xl border border-indigo-500/30 text-xs space-y-1">
                      <span className="font-bold text-indigo-400 uppercase block">Fiksna B2 Fraza:</span>
                      <p className="text-slate-200 font-mono">{currentVocab.redemittel}</p>
                      <p className="text-slate-400 italic">Primjer: "{currentVocab.example}"</p>
                    </div>

                    <button 
                      onClick={() => { setVocabIndex(vocabIndex + 1); setSelectedOpt(null); }}
                      className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl text-sm transition">
                      Sljedeći Izraz
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* MODULE 4: MOJA BAZA */}
            {tab === 'lab' && (
              <div className="space-y-5">
                <form onSubmit={addNote} className="space-y-3 bg-slate-950 p-4 rounded-xl border border-slate-800">
                  <h3 className="text-sm font-bold text-white">Dodaj Novu Riječ / Rečenicu u Bazu:</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input 
                      type="text" 
                      value={newGerman}
                      onChange={(e) => setNewGerman(e.target.value)}
                      placeholder="Njemački izraz (npr. Zugriff gewähren)"
                      className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                    />
                    <input 
                      type="text" 
                      value={newTrans}
                      onChange={(e) => setNewTrans(e.target.value)}
                      placeholder="Prevod / Značenje"
                      className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <button 
                    type="submit"
                    disabled={!newGerman.trim()}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white font-bold py-2 rounded-xl text-xs transition">
                    Sačuvaj u Bazu
                  </button>
                </form>

                <div className="space-y-2">
                  {notes.length === 0 ? (
                    <p className="text-xs text-slate-500 text-center py-6">Tvoja baza je prazna. Dodaj prvu frazu iznad!</p>
                  ) : (
                    notes.map((n) => (
                      <div key={n.id} className="bg-slate-950 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
                        <div>
                          <p className="text-xs font-bold text-slate-200">{n.german}</p>
                          {n.trans && <p className="text-[11px] text-slate-400">{n.trans}</p>}
                        </div>
                        <div className="flex items-center gap-2">
                          <button onClick={() => speakText(n.german)} className="text-xs text-slate-400 hover:text-white">🔊</button>
                          <button 
                            onClick={() => setNotes(notes.filter(item => item.id !== n.id))}
                            className="text-xs text-red-400 hover:text-red-300">✕</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
