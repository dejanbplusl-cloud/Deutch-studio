<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deutsch Studio B1/B2</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- BAZA PODATAKA SA SVRSTANIM KATEGORIJAMA I IT TEMAMA ---
    const INITIAL_DATASET = {
      writing: [
        {
          id: 'w_it1',
          topic: 'IT & Systemverwaltung',
          scenario: 'Ankündigung einer Serverwartung (Planirano održavanje servera)',
          prompt: 'Napiši obavještenje zaposlenima da će u petak od 22:00 do subote u 04:00 sata primarni serveri biti nedostupni zbog planiranog održavanja i ažuriranja sistema.',
          placeholder: 'Sehr geehrte Kolleginnen und Kollegen...',
          answerB1: 'Hallo zusammen, am Freitag von 22 Uhr bis Samstag 4 Uhr machen wir Serverwartung. Die Server funktionieren dann nicht. Bitte speichern Sie Ihre Daten.',
          answerB2: 'Sehr geehrte Kolleginnen und Kollegen, wir möchten Sie darüber informieren, dass am Freitag ab 22:00 Uhr geplante Wartungsarbeiten an unserer Serverinfrastruktur stattfinden. In diesem Zeitraum stehen die zentralen Dienste nicht zur Verfügung. Wir bitten Sie, Ihre Arbeiten rechtzeitig zu speichern.',
          keywords: ['informieren', 'Wartungsarbeiten', 'Serverinfrastruktur', 'Zeitraum', 'zur Verfügung', 'speichern'],
          tips: ['U IT okruženju umjesto "wir machen Wartung" koristi nominalni stil: "geplante Wartungsarbeiten finden statt".', 'Za sistem koji ne radi B2 izraz je: "steht nicht zur Verfügung" ili "ist vorübergehend außer Betrieb".']
        },
        {
          id: 'w_it2',
          topic: 'IT-Support & Helpdesk',
          scenario: 'Rückmeldung zu einem Ticket (Netzwerkstörung / Odgovor na ticket)',
          prompt: 'Napiši odgovor korisniku koji je prijavio problem sa VPN pristupom i mrežom. Obavijesti ga da je problem lociran i da je mrežni tim već otklonio grešku.',
          placeholder: 'Hallo Herr/Frau...',
          answerB1: 'Hallo Herr Schulze, das Problem mit dem VPN ist gelöst. Unser Team hat den Fehler repariert. Sie können sich wieder anmelden.',
          answerB2: 'Hallo Herr Schulze, vielen Dank für Ihre Meldung. Die Netzwerkstörung im Zusammenhang mit dem VPN-Zugang konnte erfolgreich lokalisiert und durch unser IT-Team behoben werden. Der Zugriff sollte ab sofort wieder einwandfrei funktionieren.',
          keywords: ['Meldung', 'Netzwerkstörung', 'lokalisiert', 'behoben', 'Zugriff', 'einwandfrei'],
          tips: ['Za grešku/problem u IT-u koristi se glagol "beheben" (einen Fehler/eine Störung beheben), a ne "reparieren".', 'Pristup sistemu se naziva "der Zugriff" (der Zugriff auf das System).']
        },
        {
          id: 'w_it3',
          topic: 'IT & Systemverwaltung',
          scenario: 'Sicherheitswarnung / Phishing-Mail (Upozorenje o bezbjednosti)',
          prompt: 'Napiši kratko upozorenje kolegama o sumnjivim e-mailovima koji kruže u firmi i zamoli ih da ne klikću na linkove niti otvaraju priloge.',
          placeholder: 'Achtung an alle Mitarbeiter...',
          answerB1: 'Achtung! Es gibt gefälschte E-Mails in der Firma. Bitte klicken Sie nicht auf die Links und öffnen Sie keine Dateien.',
          answerB2: 'Liebe Kolleginnen und Kollegen, aktuell sind verdächtige Phishing-E-Mails in Umlauf. Wir bitten Sie dringend, keine verdächtigen Links anzuklicken und keine Dateianhänge von unbekannten Absendern zu öffnen.',
          keywords: ['aktuell', 'verdächtige', 'in Umlauf', 'dringend', 'Dateianhänge', 'Absender'],
          tips: ['Prilog e-maila je "der Dateianhang" (mn. die Dateianhänge).', 'Za e-mailove koji se šire koristi se fraza "in Umlauf sein".']
        },
        {
          id: 'w1',
          topic: 'Beruf',
          scenario: 'Krankmeldung beim Arbeitgeber (Prijava bolovanja)',
          prompt: 'Napiši kratki e-mail šefu u kojem obavještavaš da si bolestan, da ne dolaziš danas na posao, da ideš doktoru i da ćeš javiti čim dobiješ doznaku (AU-Bescheinigung).',
          placeholder: 'Sehr geehrte/r Frau/Herr...',
          answerB1: 'Hallo Herr Müller, ich bin heute krank und kann nicht zur Arbeit kommen. Ich gehe zum Arzt und schreibe Ihnen später.',
          answerB2: 'Sehr geehrter Herr Müller, hiermit möchte ich Sie darüber informieren, dass ich heute krankheitsbedingt nicht am Arbeitsplatz erscheinen kann. Ich werde heute Morgen einen Arzt aufsuchen und Ihnen die Arbeitsunfähigkeitsbescheinigung baldmöglichst zukommen lassen.',
          keywords: ['krankheitsbedingt', 'Arbeitsplatz', 'aufsuchen', 'Arbeitsunfähigkeitsbescheinigung', 'zukommen lassen'],
          tips: ['B1 koristi "ich bin krank", dok B2 koristi elegantnije "krankheitsbedingt nicht erscheinen können".', 'Umjesto "ich schicke die Bescheinigung" koristi "zukommen lassen".']
        }
      ],

      errors: [
        {
          id: 'e_it1',
          topic: 'IT & Systemverwaltung',
          sentence: 'Der Administrator hat das neue Firewall-Update gestern installiert werden.',
          isCorrect: false,
          correctSentence: 'Der Administrator hat das neue Firewall-Update gestern installiert.',
          explanation: 'Aktivna prošlost (Perfekt) se tvori: hat + Partizip II (installiert). Dodavanje "werden" pravi pogrešnu pasivnu konstrukciju.',
          category: 'Aktiv vs. Passiv'
        },
        {
          id: 'e_it2',
          topic: 'IT-Support & Helpdesk',
          sentence: 'Bei technische Problemen wenden Sie sich bitte direkt an den IT-Helpdesk.',
          isCorrect: false,
          correctSentence: 'Bei technischen Problemen wenden Sie sich bitte direkt an den IT-Helpdesk.',
          explanation: 'Predlog "bei" uvek zahtijeva DATIV. Množina bez člana u dativu: pridjev dobija nastavak -en (bei technischen Problemen).',
          category: 'Adjektivdeklination (Dativ Plural)'
        },
        {
          id: 'e_it3',
          topic: 'IT & Systemverwaltung',
          sentence: 'Wegen ein schwerer Systemfehler musste der Hauptserver heruntergefahren werden.',
          isCorrect: false,
          correctSentence: 'Wegen eines schweren Systemfehlers musste der Hauptserver heruntergefahren werden.',
          explanation: 'Predlog "wegen" u formalnom i B2/C1 njemačkom jeziku zahtijeva GENITIV (eines schweren Systemfehlers).',
          category: 'Genitivpräpositionen (Wegen)'
        }
      ],

      vocabulary: [
        {
          id: 'v_it1',
          topic: 'IT & Systemverwaltung',
          basic: 'neue Software aufspielen',
          context: 'Wir müssen die neue Software auf den Servern installieren.',
          options: ['bereitstellen', 'hochmachen', 'einsetzen tun', 'abstellen'],
          correctOption: 'bereitstellen',
          redemittel: 'eine Anwendung im Netzwerk bereitstellen / ausrollen',
          example: 'Das Update wurde erfolgreich im gesamten Unternehmensnetzwerk bereitgestellt.'
        },
        {
          id: 'v_it2',
          topic: 'IT-Support & Helpdesk',
          basic: 'Zugang geben',
          context: 'Der neue Mitarbeiter braucht Zugang zum Ordner.',
          options: ['Zugriff gewähren', 'Zugang erlauben', 'Rechte öffnen', 'Passwort schicken'],
          correctOption: 'Zugriff gewähren',
          redemittel: 'jemandem Zugriff auf ein System gewähren',
          example: 'Dem neuen Systemadministrator wurden die erforderlichen Zugriffsrechte gewährt.'
        }
      ],

      grammarDrill: [
        {
          id: 'g_it1',
          topic: 'IT & Systemverwaltung',
          question: 'Die Daten werden automatisch jeden Abend auf ein externes Laufwerk _____.',
          options: ['gesichert', 'sichern', 'gesichert werden', 'sicherte'],
          correct: 'gesichert',
          explanation: 'Sadašnji pasiv (Präsens Passiv): werden + Partizip II (gesichert).'
        },
        {
          id: 'g_it2',
          topic: 'IT-Support & Helpdesk',
          question: 'Bitte starten Sie den Rechner neu, _____ das Problem weiterhin besteht.',
          options: ['falls', 'obwohl', 'trotzdem', 'damit'],
          correct: 'falls',
          explanation: 'Za uslov ("u slučaju da") koristi se uslovni veznik "falls" ili "wenn".'
        }
      ]
    };

    const ALL_TOPICS = [
      'Sve Teme', 'IT & Systemverwaltung', 'IT-Support & Helpdesk', 
      'Beruf', 'Projektmanagement', 'Meetings & Smalltalk', 'Amt & Behörden'
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('writing');
      const [selectedTopic, setSelectedTopic] = useState('Sve Teme');
      
      const [stats, setStats] = useState(() => {
        const saved = localStorage.getItem('de_meister_stats');
        return saved ? JSON.parse(saved) : { xp: 120, streak: 3 };
      });

      const [writingIndex, setWritingIndex] = useState(0);
      const [errorIndex, setErrorIndex] = useState(0);
      const [vocabIndex, setVocabIndex] = useState(0);
      const [grammarIndex, setGrammarIndex] = useState(0);

      const [userInput, setUserInput] = useState('');
      const [showResult, setShowResult] = useState(false);
      const [selectedChoice, setSelectedChoice] = useState(null);

      // Moja Baza (Custom Lab & Sačuvano)
      const [customLab, setCustomLab] = useState(() => {
        const saved = localStorage.getItem('de_meister_custom');
        return saved ? JSON.parse(saved) : [];
      });
      const [newGerman, setNewGerman] = useState('');
      const [newTrans, setNewTrans] = useState('');
      const [newNote, setNewNote] = useState('');

      useEffect(() => {
        localStorage.setItem('de_meister_stats', JSON.stringify(stats));
      }, [stats]);

      useEffect(() => {
        localStorage.setItem('de_meister_custom', JSON.stringify(customLab));
      }, [customLab]);

      const speak = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'de-DE';
          u.rate = 0.9;
          window.speechSynthesis.speak(u);
        }
      };

      const addCustomItem = (e) => {
        e.preventDefault();
        if (!newGerman.trim()) return;
        setCustomLab([{ id: Date.now(), german: newGerman, translation: newTrans, note: newNote, date: new Date().toLocaleDateString() }, ...customLab]);
        setNewGerman('');
        setNewTrans('');
        setNewNote('');
      };

      // Filter po temama
      const filterList = (list) => {
        if (selectedTopic === 'Sve Teme') return list;
        return list.filter(item => item.topic === selectedTopic);
      };

      const currentWritingList = filterList(INITIAL_DATASET.writing);
      const currentErrorList = filterList(INITIAL_DATASET.errors);
      const currentVocabList = filterList(INITIAL_DATASET.vocabulary);
      const currentGrammarList = filterList(INITIAL_DATASET.grammarDrill);

      const currentWriting = currentWritingList[writingIndex % (currentWritingList.length || 1)];
      const currentError = currentErrorList[errorIndex % (currentErrorList.length || 1)];
      const currentVocab = currentVocabList[vocabIndex % (currentVocabList.length || 1)];
      const currentGrammar = currentGrammarList[grammarIndex % (currentGrammarList.length || 1)];

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased pb-12">
          {/* HEADER */}
          <header className="border-b border-slate-800 bg-slate-900/60 sticky top-0 z-50 backdrop-blur-md">
            <div className="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
              <div>
                <h1 className="text-lg font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-violet-400">
                  Deutsch Studio B1/B2
                </h1>
                <p className="text-[10px] text-indigo-400 font-semibold tracking-wider uppercase">
                  Writing & Vocabulary Mastery • IT & Admin Focus
                </p>
              </div>

              <div className="flex items-center gap-3">
                <span className="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1 rounded-full text-xs font-bold">
                  🔥 {stats.streak} Days
                </span>
                <span className="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full text-xs font-bold">
                  🏆 {stats.xp} XP
                </span>
              </div>
            </div>
          </header>

          {/* FILTER TRAKA ZA TEME */}
          <div className="bg-slate-900/40 border-b border-slate-800/60 py-2.5">
            <div className="max-w-6xl mx-auto px-4 flex items-center gap-2 overflow-x-auto scrollbar-none">
              <span className="text-xs font-bold text-slate-400 uppercase shrink-0 mr-2">Kategorija:</span>
              {ALL_TOPICS.map(t => (
                <button
                  key={t}
                  onClick={() => { setSelectedTopic(t); setWritingIndex(0); setErrorIndex(0); setVocabIndex(0); }}
                  className={`px-3 py-1 rounded-xl text-xs font-medium shrink-0 transition ${
                    selectedTopic === t 
                      ? 'bg-indigo-600 text-white font-bold' 
                      : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'
                  }`}
                >
                  {t}
                </button>
              ))}
            </div>
          </div>

          {/* GLAVNE NAVIGACIJSKE KARTICE */}
          <nav className="max-w-6xl mx-auto px-4 pt-6 pb-4">
            <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800">
              <button
                onClick={() => { setActiveTab('writing'); setShowResult(false); }}
                className={`py-2.5 px-2 rounded-xl text-xs font-bold transition ${activeTab === 'writing' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                📝 Pisanje & Style
              </button>
              <button
                onClick={() => { setActiveTab('error'); setShowResult(false); setSelectedChoice(null); }}
                className={`py-2.5 px-2 rounded-xl text-xs font-bold transition ${activeTab === 'error' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                ⚠️ Detektor Grešaka
              </button>
              <button
                onClick={() => { setActiveTab('vocab'); setSelectedChoice(null); }}
                className={`py-2.5 px-2 rounded-xl text-xs font-bold transition ${activeTab === 'vocab' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                📚 Vokabular B1→B2
              </button>
              <button
                onClick={() => { setActiveTab('grammar'); setSelectedChoice(null); }}
                className={`py-2.5 px-2 rounded-xl text-xs font-bold transition ${activeTab === 'grammar' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                ✨ Gramatika Drill
              </button>
              <button
                onClick={() => setActiveTab('lab')}
                className={`col-span-2 sm:col-span-1 py-2.5 px-2 rounded-xl text-xs font-bold transition ${activeTab === 'lab' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                🔖 Moja Baza ({customLab.length})
              </button>
            </div>
          </nav>

          {/* GLAVNI SADRŽAJ */}
          <main className="max-w-6xl mx-auto px-4">
            {/* MODULE 1: PISANJE */}
            {activeTab === 'writing' && currentWriting && (
              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-5">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <span className="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs px-3 py-1 rounded-full font-bold">
                    {currentWriting.topic}
                  </span>
                  <button onClick={() => speak(currentWriting.prompt)} className="text-xs text-slate-400 hover:text-white">
                    🔊 Poslušaj zadatak
                  </button>
                </div>

                <div>
                  <h3 className="text-slate-100 font-bold text-base mb-1">{currentWriting.scenario}</h3>
                  <p className="text-slate-300 text-sm bg-slate-950/60 p-4 rounded-xl border border-slate-800">{currentWriting.prompt}</p>
                </div>

                <div>
                  <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Tvoj Odgovor:</label>
                  <textarea
                    rows={4}
                    value={userInput}
                    onChange={(e) => setUserInput(e.target.value)}
                    placeholder={currentWriting.placeholder}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition"
                  />
                </div>

                {currentWriting.keywords && (
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Preporučene fraze:</span>
                    <div className="flex flex-wrap gap-1.5">
                      {currentWriting.keywords.map((kw, i) => (
                        <span key={i} className="px-2 py-0.5 bg-slate-950 text-indigo-300 text-xs rounded border border-slate-800 font-mono">{kw}</span>
                      ))}
                    </div>
                  </div>
                )}

                <div className="flex justify-between gap-4 pt-2">
                  <button onClick={() => { setWritingIndex(writingIndex + 1); setShowResult(false); setUserInput(''); }} className="px-4 py-2.5 bg-slate-950 hover:bg-slate-800 text-slate-300 rounded-xl text-xs font-bold border border-slate-800">
                    Sljedeća Vježba
                  </button>
                  <button onClick={() => setShowResult(!showResult)} disabled={!userInput.trim()} className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white rounded-xl text-xs font-bold shadow-lg">
                    {showResult ? 'Sakrij Uporedna Rešenja' : 'Uporedi sa B1 / B2'}
                  </button>
                </div>

                {showResult && (
                  <div className="space-y-4 pt-4 border-t border-slate-800">
                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-4">
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-xs font-bold text-amber-400 uppercase">Standardni B1 Odgovor:</span>
                        <button onClick={() => speak(currentWriting.answerB1)} className="text-xs text-slate-400">🔊</button>
                      </div>
                      <p className="text-slate-300 text-xs italic">"{currentWriting.answerB1}"</p>
                    </div>

                    <div className="bg-emerald-950/20 border border-emerald-500/30 rounded-xl p-4">
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-xs font-bold text-emerald-400 uppercase">Poslovni B2 Odgovor:</span>
                        <button onClick={() => speak(currentWriting.answerB2)} className="text-xs text-slate-400">🔊</button>
                      </div>
                      <p className="text-slate-100 text-xs font-medium italic mb-2">"{currentWriting.answerB2}"</p>
                      {currentWriting.tips && (
                        <div className="pt-2 border-t border-emerald-500/20 space-y-1">
                          {currentWriting.tips.map((tip, i) => (
                            <p key={i} className="text-[11px] text-slate-300">💡 {tip}</p>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* MODULE 2: DETEKTOR GREŠAKA */}
            {activeTab === 'error' && currentError && (
              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-5">
                <span className="px-3 py-1 bg-violet-500/10 text-violet-400 text-xs font-bold rounded-full border border-violet-500/20">
                  {currentError.category}
                </span>

                <div className="bg-slate-950 p-5 rounded-xl border border-slate-800 text-center text-sm font-mono text-slate-100">
                  "{currentError.sentence}"
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <button onClick={() => setSelectedChoice(true)} className={`p-4 rounded-xl border font-bold text-xs transition ${selectedChoice === true ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>
                    Tačno (Richtig)
                  </button>
                  <button onClick={() => setSelectedChoice(false)} className={`p-4 rounded-xl border font-bold text-xs transition ${selectedChoice === false ? 'bg-rose-500/20 border-rose-500 text-rose-300' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>
                    Netačno (Falsch)
                  </button>
                </div>

                {selectedChoice !== null && (
                  <div className="space-y-4 pt-2">
                    <div className={`p-4 rounded-xl border text-xs ${selectedChoice === currentError.isCorrect ? 'bg-emerald-950/30 border-emerald-500/40 text-emerald-200' : 'bg-rose-950/30 border-rose-500/40 text-rose-200'}`}>
                      <p className="font-bold mb-1">{selectedChoice === currentError.isCorrect ? '✅ Tačno zapaganje!' : '❌ Pogrešno!'}</p>
                      <p className="text-slate-300 leading-relaxed">{currentError.explanation}</p>
                      {!currentError.isCorrect && (
                        <p className="text-emerald-300 font-semibold mt-2">Ispravno: "{currentError.correctSentence}"</p>
                      )}
                    </div>

                    <button onClick={() => { setErrorIndex(errorIndex + 1); setSelectedChoice(null); }} className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xs">
                      Sljedeća Rečenica
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* MODULE 3: VOKABULAR B1 -> B2 */}
            {activeTab === 'vocab' && currentVocab && (
              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-5">
                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-1">
                  <span className="text-[10px] font-bold text-amber-400 uppercase block">B1 Osnovni Izraz:</span>
                  <span className="text-lg font-bold text-white block">{currentVocab.basic}</span>
                  <p className="text-xs text-slate-400 italic">Kontekst: "{currentVocab.context}"</p>
                </div>

                <span className="text-xs font-bold text-slate-300 uppercase block">Izaberi naprednu B2 zamjenu:</span>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {currentVocab.options.map((opt, i) => {
                    const isCorrect = opt === currentVocab.correctOption;
                    const isSelected = selectedChoice === opt;
                    let style = 'bg-slate-950 border-slate-800 text-slate-200';

                    if (selectedChoice) {
                      if (isCorrect) style = 'bg-emerald-950/40 border-emerald-500 text-emerald-300 font-bold';
                      else if (isSelected) style = 'bg-rose-950/40 border-rose-500 text-rose-300 font-bold';
                    }

                    return (
                      <button key={i} onClick={() => setSelectedChoice(opt)} disabled={!!selectedChoice} className={`p-3.5 rounded-xl border text-xs text-left transition ${style}`}>
                        {opt}
                      </button>
                    );
                  })}
                </div>

                {selectedChoice && (
                  <div className="space-y-4 pt-2">
                    <div className="bg-slate-950 p-4 rounded-xl border border-indigo-500/30 text-xs space-y-1">
                      <span className="font-bold text-indigo-400 uppercase block">Fiksna B2 Fraza:</span>
                      <p className="text-slate-200 font-mono">{currentVocab.redemittel}</p>
                      <p className="text-slate-400 italic">Primjer: "{currentVocab.example}"</p>
                    </div>

                    <button onClick={() => { setVocabIndex(vocabIndex + 1); setSelectedChoice(null); }} className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl text-xs">
                      Sljedeći Izraz
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* MODULE 4: GRAMMAR DRILL */}
            {activeTab === 'grammar' && currentGrammar && (
              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-5">
                <div className="bg-slate-950 p-5 rounded-xl border border-slate-800 text-center text-sm font-semibold text-slate-100">
                  {currentGrammar.question}
                </div>

                <div className="grid grid-cols-2 gap-3">
                  {currentGrammar.options.map((opt, i) => {
                    const isCorrect = opt === currentGrammar.correct;
                    const isSelected = selectedChoice === opt;
                    let style = 'bg-slate-950 border-slate-800 text-slate-200';

                    if (selectedChoice) {
                      if (isCorrect) style = 'bg-emerald-950/40 border-emerald-500 text-emerald-300 font-bold';
                      else if (isSelected) style = 'bg-rose-950/40 border-rose-500 text-rose-300 font-bold';
                    }

                    return (
                      <button key={i} onClick={() => setSelectedChoice(opt)} disabled={!!selectedChoice} className={`p-3.5 rounded-xl border text-xs transition ${style}`}>
                        {opt}
                      </button>
                    );
                  })}
                </div>

                {selectedChoice && (
                  <div className="space-y-4 pt-2">
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs text-slate-300">
                      <span className="font-bold text-indigo-400 block mb-1">Objašnjenje pravila:</span>
                      {currentGrammar.explanation}
                    </div>

                    <button onClick={() => { setGrammarIndex(grammarIndex + 1); setSelectedChoice(null); }} className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl text-xs">
                      Sljedeće Pitanje
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* MODULE 5: MOJA BAZA & UROCI */}
            {activeTab === 'lab' && (
              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                <form onSubmit={addCustomItem} className="space-y-3 bg-slate-950 p-4 rounded-xl border border-slate-800">
                  <h3 className="text-xs font-bold text-white uppercase">Dodaj Novu Riječ ili Rečenicu:</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input
                      type="text"
                      value={newGerman}
                      onChange={(e) => setNewGerman(e.target.value)}
                      placeholder="Njemački tekst (npr. Zugriff gewähren)"
                      className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                    />
                    <input
                      type="text"
                      value={newTrans}
                      onChange={(e) => setNewTrans(e.target.value)}
                      placeholder="Prevod / Značenje"
                      className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <input
                    type="text"
                    value={newNote}
                    onChange={(e) => setNewNote(e.target.value)}
                    placeholder="Napomena (opciono: npr. IT / Systemadmin)"
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                  />
                  <button type="submit" disabled={!newGerman.trim()} className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white font-bold py-2 rounded-xl text-xs transition">
                    Sačuvaj u Bazu
                  </button>
                </form>

                <div className="space-y-2">
                  {customLab.length === 0 ? (
                    <p className="text-xs text-slate-500 text-center py-6">Tvoja baza je prazna. Dodaj prvu frazu iznad!</p>
                  ) : (
                    customLab.map((item) => (
                      <div key={item.id} className="bg-slate-950 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
                        <div>
                          <p className="text-xs font-bold text-slate-100">{item.german}</p>
                          {item.translation && <p className="text-[11px] text-slate-400">{item.translation}</p>}
                          {item.note && <span className="inline-block mt-1 text-[9px] bg-indigo-950 text-indigo-400 border border-indigo-800 px-1.5 py-0.5 rounded">{item.note}</span>}
                        </div>
                        <div className="flex items-center gap-2">
                          <button onClick={() => speak(item.german)} className="text-xs text-slate-400 hover:text-white">🔊</button>
                          <button onClick={() => setCustomLab(customLab.filter(c => c.id !== item.id))} className="text-xs text-red-400">✕</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
