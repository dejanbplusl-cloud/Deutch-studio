<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deutsch Studio B1/B2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const initialWritingExercises = [
      {
        id: 1,
        topic: "IT & Systemverwaltung",
        scenario: "Obavještenje korisnicima o planiranom održavanju servera i nedostupnosti mreže.",
        b1Answer: "Am Samstag ab 22 Uhr ist der Server wegen Wartungsarbeiten nicht erreichbar.",
        b2Answer: "Wir möchten Sie darüber informieren, dass die Server aufgrund von Wartungsarbeiten am Samstag ab 22:00 Uhr vorübergehend außer Betrieb sein werden.",
        keyPhrases: ["außer Betrieb sein", "aufgrund von Wartungsarbeiten", "vorübergehend"],
        grammarNote: "Korištenje 'aufgrund von' (+ Dativ) i formalne fraze 'außer Betrieb sein' umjesto 'nicht gehen'."
      },
      {
        id: 2,
        topic: "IT-Support & Helpdesk",
        scenario: "Eskalacija problema sa pristupnim pravima korisnika prema mrežnom administratoru.",
        b1Answer: "Der Benutzer hat keine Rechte. Ich schicke das Ticket an den Admin.",
        b2Answer: "Da der Benutzer nicht über die erforderlichen Zugriffsrechte verfügt, leite ich das Ticket an die Systemverwaltung weiter.",
        keyPhrases: ["über Rechte verfügen", "erforderliche Zugriffsrechte", "Ticket weiterleiten"],
        grammarNote: "Kauzali konektor 'Da' pomjera glagol na kraj Nebensatz-a ('verfügt')."
      },
      {
        id: 3,
        topic: "Amt & Behörden",
        scenario: "Zphtjev za produženje roka za dostavu dokumenata.",
        b1Answer: "Ich brauche mehr Zeit für die Dokumente und bitte um einen neuen Termin.",
        b2Answer: "Hiermit beantrage ich eine Fristverlängerung für die Einreichung der fehlenden Unterlagen.",
        keyPhrases: ["Fristverlängerung beantragen", "Einreichung der Unterlagen", "fehlende Unterlagen"],
        grammarNote: "Poslovni stil koristi imeničke konstrukcije ('die Einreichung' umjesto 'einreichen')."
      }
    ];

    const initialErrorExercises = [
      {
        id: 1,
        topic: "IT & Network",
        incorrect: "Ich habe dem Kunde über die Netzwerkausfall informiert.",
        correct: "Ich habe den Kunden über den Netzwerkausfall informiert.",
        explanation: "1. 'informieren' traži Akuzativ (den Kunden).\n2. 'Kunde' ima N-Deklination (den Kunden).\n3. 'Ausfall' je muškog roda (der Ausfall -> Akuzativ: den Netzwerkausfall).",
        ruleType: "N-Deklination & Akkusativ"
      },
      {
        id: 2,
        topic: "Grammatik / Nebensatz",
        incorrect: "Ich rufe Sie an, weil der Server ist abgestürzt.",
        correct: "Ich rufe Sie an, weil der Server abgestürzt ist.",
        explanation: "Konektor 'weil' uvodi sporednu rečenicu (Nebensatz) gdje pomjerani glagol (ist) ide na sam kraj.",
        ruleType: "Wortstellung Nebensatz"
      },
      {
        id: 3,
        topic: "Wechselpräpositionen",
        incorrect: "Wir installieren die neue Software auf dem Server.",
        correct: "Wir installieren die neue Software auf den Server.",
        explanation: "Pitanje 'Wohin?' (Kuda instaliramo?) zahtijeva Akuzativ (auf den Server). Kada je nešto već tamo ('Wo?'), onda ide Dativ.",
        ruleType: "Akkusativ vs. Dativ"
      }
    ];

    function App() {
      const [tab, setTab] = useState('writing');
      const [writingEx, setWritingEx] = useState(initialWritingExercises);
      const [errorEx, setErrorEx] = useState(initialErrorExercises);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [userInput, setUserInput] = useState('');
      const [showResult, setShowResult] = useState(false);
      const [streak, setStreak] = useState(1);
      const [savedNotes, setSavedNotes] = useState(() => {
        const saved = localStorage.getItem('my_deutsch_notes');
        return saved ? JSON.parse(saved) : [];
      });
      const [newNote, setNewNote] = useState('');

      useEffect(() => {
        localStorage.setItem('my_deutsch_notes', JSON.stringify(savedNotes));
      }, [savedNotes]);

      const activeWriting = writingEx[currentIdx % writingEx.length];
      const activeError = errorEx[currentIdx % errorEx.length];

      const addNote = () => {
        if (!newNote.trim()) return;
        setSavedNotes([{ id: Date.now(), text: newNote, date: new Date().toLocaleDateString() }, ...savedNotes]);
        setNewNote('');
      };

      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'de-DE';
          window.speechSynthesis.speak(utterance);
        }
      };

      return (
        <div className="max-w-4xl mx-auto p-4 sm:p-6">
          {/* Header */}
          <header className="flex flex-wrap items-center justify-between border-b border-slate-800 pb-4 mb-6">
            <div>
              <h1 className="text-2xl font-bold text-indigo-400">Deutsch Studio B1/B2</h1>
              <p className="text-xs text-slate-400">Intensive Language & Writing Coach for IT & Business</p>
            </div>
            <div className="flex gap-2 mt-2 sm:mt-0">
              <span className="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1 rounded-full text-xs font-semibold">
                🔥 {streak} Tag Streak
              </span>
              <span className="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full text-xs font-semibold">
                🎯 B1/B2
              </span>
            </div>
          </header>

          {/* Navigacija */}
          <nav className="flex bg-slate-800/60 p-1 rounded-xl mb-6 border border-slate-700/50">
            <button 
              onClick={() => { setTab('writing'); setShowResult(false); setUserInput(''); }}
              className={`flex-1 py-2.5 text-xs font-semibold rounded-lg transition-all ${tab === 'writing' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
              📝 Pisanje & Stil
            </button>
            <button 
              onClick={() => { setTab('error'); setShowResult(false); setUserInput(''); }}
              className={`flex-1 py-2.5 text-xs font-semibold rounded-lg transition-all ${tab === 'error' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
              🔍 Detektor Grešaka
            </button>
            <button 
              onClick={() => setTab('notes')}
              className={`flex-1 py-2.5 text-xs font-semibold rounded-lg transition-all ${tab === 'notes' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
              📁 Moja Baza ({savedNotes.length})
            </button>
          </nav>

          {/* Glavni Sadržaj */}
          <main className="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-6 shadow-xl">
            {tab === 'writing' && (
              <div className="space-y-5">
                <div className="flex justify-between items-center">
                  <span className="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-xs px-3 py-1 rounded-md font-semibold">
                    {activeWriting.topic}
                  </span>
                  <button 
                    onClick={() => { setCurrentIdx(currentIdx + 1); setShowResult(false); setUserInput(''); }}
                    className="text-xs text-indigo-400 hover:underline">
                    Sljedeći scenario &rarr;
                  </button>
                </div>

                <div>
                  <h2 className="text-base font-semibold text-white mb-1">Scenario:</h2>
                  <p className="text-sm text-slate-300 bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">{activeWriting.scenario}</p>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-2">Tvoj odgovor na njemačkom:</label>
                  <textarea 
                    rows="3" 
                    value={userInput}
                    onChange={(e) => setUserInput(e.target.value)}
                    placeholder="Napiši rečenicu..."
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-colors"
                  ></textarea>
                </div>

                {!showResult ? (
                  <button 
                    onClick={() => setShowResult(true)}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm transition-all shadow-lg">
                    Uporedi sa B1/B2 Standardom
                  </button>
                ) : (
                  <div className="space-y-4 pt-2">
                    <div className="bg-slate-900/90 border border-slate-700/80 p-4 rounded-xl space-y-3">
                      <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span className="text-xs font-semibold text-amber-400">B1 Standardni Odgovor:</span>
                        <button onClick={() => speakText(activeWriting.b1Answer)} className="text-xs text-slate-400 hover:text-white">🔊 Izgovor</button>
                      </div>
                      <p className="text-xs text-slate-200">{activeWriting.b1Answer}</p>

                      <div className="flex justify-between items-center border-b border-slate-800 pb-2 pt-2">
                        <span className="text-xs font-semibold text-indigo-400">B2 Elevirani / Poslovni Odgovor:</span>
                        <button onClick={() => speakText(activeWriting.b2Answer)} className="text-xs text-slate-400 hover:text-white">🔊 Izgovor</button>
                      </div>
                      <p className="text-xs text-slate-100 font-medium">{activeWriting.b2Answer}</p>

                      <div className="pt-2 border-t border-slate-800">
                        <span className="text-xs font-semibold text-emerald-400">💡 Gramatička napomena:</span>
                        <p className="text-xs text-slate-400 mt-1">{activeWriting.grammarNote}</p>
                      </div>
                    </div>

                    <button 
                      onClick={() => { setCurrentIdx(currentIdx + 1); setShowResult(false); setUserInput(''); }}
                      className="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 rounded-xl text-sm transition-all">
                      Sljedeća Vježba
                    </button>
                  </div>
                )}
              </div>
            )}

            {tab === 'error' && (
              <div className="space-y-5">
                <div className="flex justify-between items-center">
                  <span className="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-xs px-3 py-1 rounded-md font-semibold">
                    {activeError.ruleType}
                  </span>
                  <button 
                    onClick={() => { setCurrentIdx(currentIdx + 1); setShowResult(false); setUserInput(''); }}
                    className="text-xs text-indigo-400 hover:underline">
                    Sljedeći primjer &rarr;
                  </button>
                </div>

                <div>
                  <h2 className="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Pronađi i ispravi grešku:</h2>
                  <div className="bg-slate-900 border border-red-500/30 p-4 rounded-xl text-red-300 font-mono text-sm">
                    "{activeError.incorrect}"
                  </div>
                </div>

                {!showResult ? (
                  <button 
                    onClick={() => setShowResult(true)}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm transition-all shadow-lg">
                    Prikaži Tačnu Rečenicu i Objašnjenje
                  </button>
                ) : (
                  <div className="space-y-4 pt-2">
                    <div className="bg-slate-900/90 border border-emerald-500/30 p-4 rounded-xl space-y-3">
                      <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span className="text-xs font-semibold text-emerald-400">✅ Tačna Rečenica:</span>
                        <button onClick={() => speakText(activeError.correct)} className="text-xs text-slate-400 hover:text-white">🔊 Izgovor</button>
                      </div>
                      <p className="text-sm font-semibold text-emerald-300 font-mono">{activeError.correct}</p>

                      <div className="pt-2 border-t border-slate-800">
                        <span className="text-xs font-semibold text-indigo-400">💡 Pravilo & Objašnjenje:</span>
                        <p className="text-xs text-slate-300 mt-1 whitespace-pre-line leading-relaxed">{activeError.explanation}</p>
                      </div>
                    </div>

                    <button 
                      onClick={() => { setCurrentIdx(currentIdx + 1); setShowResult(false); setUserInput(''); }}
                      className="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 rounded-xl text-sm transition-all">
                      Sljedeći Primjer
                    </button>
                  </div>
                )}
              </div>
            )}

            {tab === 'notes' && (
              <div className="space-y-5">
                <h2 className="text-base font-semibold text-white">Moja Lična Baza Fraza i Grešaka</h2>
                <p className="text-xs text-slate-400">Ovdje možeš zabilježiti fraze koje čuješ na poslu ili u gradu i vježbati ih kasnije sa bilo kog uređaja.</p>

                <div className="flex gap-2">
                  <input 
                    type="text" 
                    value={newNote}
                    onChange={(e) => setNewNote(e.target.value)}
                    placeholder="Unesi frazu, riječ ili rečenicu..."
                    className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"
                  />
                  <button 
                    onClick={addNote}
                    className="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-2 rounded-xl text-sm transition-all">
                    Sačuvaj
                  </button>
                </div>

                <div className="space-y-2 pt-2">
                  {savedNotes.length === 0 ? (
                    <p className="text-xs text-slate-500 text-center py-6">Još nema sačuvanih fraza. Unesi prvu iznad!</p>
                  ) : (
                    savedNotes.map((note) => (
                      <div key={note.id} className="bg-slate-900 border border-slate-700/60 p-3 rounded-xl flex justify-between items-center">
                        <div>
                          <p className="text-xs text-slate-200">{note.text}</p>
                          <span className="text-[10px] text-slate-500">{note.date}</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <button onClick={() => speakText(note.text)} className="text-xs text-slate-400 hover:text-white">🔊</button>
                          <button 
                            onClick={() => setSavedNotes(savedNotes.filter(n => n.id !== note.id))}
                            className="text-xs text-red-400 hover:text-red-300">✕</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
